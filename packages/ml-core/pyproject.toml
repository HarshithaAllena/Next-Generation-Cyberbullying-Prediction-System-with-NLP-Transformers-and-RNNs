# =============================================================================
# ML-CORE PACKAGE - pyproject.toml
# =============================================================================
# Purpose: Configuration for ML core package with PyTorch and Transformers.
#
# Author: Cyberbullying Prediction Team
# Version: 1.0.0
# =============================================================================

[tool.poetry]
name = "cyberbullying-ml-core"
version = "1.0.0"
description = "Core ML utilities and model architectures for Cyberbullying NLP"
authors = ["Cyberbullying Prediction Team <team@example.com>"]
license = "MIT"
readme = "README.md"
keywords = ["cyberbullying", "nlp", "machine-learning", "pytorch", "transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

packages = [{ include = "cyberbullying_ml_core" }]

# =============================================================================
# CORE DEPENDENCIES
# =============================================================================
[tool.poetry.dependencies]
python = "^3.11"

# Deep Learning - PyTorch (primary framework)
torch = "^2.1.0"

# Transformers for BERT, RoBERTa, etc.
transformers = "^4.36.0"

# Sentence transformers for embeddings
sentence-transformers = "^2.2.0"

# Scientific computing
numpy = "^1.26.0"
scipy = "^1.11.0"

# Machine learning
scikit-learn = "^1.3.0"

# Data handling
pandas = "^2.1.0"

# Progress bars
tqdm = "^4.66.0"

# Configuration
pydantic = "^2.5.0"

# =============================================================================
# OPTIONAL DEPENDENCIES
# =============================================================================
[tool.poetry.dependencies.tensorflow]
version = "^2.15.0"
optional = true

[tool.poetry.dependencies.keras]
version = "^2.15.0"
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
mypy = "^1.8.0"
black = "^23.12.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
