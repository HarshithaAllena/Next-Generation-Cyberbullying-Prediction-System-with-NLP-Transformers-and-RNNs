# =============================================================================
# DATA MODELS PACKAGE - pyproject.toml
# =============================================================================
# Purpose: Configuration for Pydantic data models package.
#
# Author: Cyberbullying Prediction Team
# Version: 1.0.0
# =============================================================================

[tool.poetry]
name = "cyberbullying-data-models"
version = "1.0.0"
description = "Pydantic schemas and data validation models for Cyberbullying NLP"
authors = ["Cyberbullying Prediction Team <team@example.com>"]
license = "MIT"
readme = "README.md"
keywords = ["cyberbullying", "nlp", "pydantic", "schemas", "validation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]

packages = [{ include = "cyberbullying_data_models" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
mypy = "^1.8.0"
black = "^23.12.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
