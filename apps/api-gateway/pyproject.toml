[tool.poetry]
name = "api-gateway"
version = "1.0.0"
description = "API Gateway for Cyberbullying NLP System"
authors = ["Cyberbullying Prediction Team"]

packages = [{ include = "api_gateway" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = { version = "^0.27.0", extras = ["standard"] }
pydantic = "^2.5.0"

cyberbullying-shared-common = { path = "../../packages/shared-common" }
cyberbullying-data-models = { path = "../../packages/data-models" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
