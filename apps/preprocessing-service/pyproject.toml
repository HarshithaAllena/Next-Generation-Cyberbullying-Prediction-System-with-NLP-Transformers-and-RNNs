# =============================================================================
# PREPROCESSING SERVICE - pyproject.toml
# =============================================================================

[tool.poetry]
name = "preprocessing-service"
version = "1.0.0"
description = "Text preprocessing microservice for Cyberbullying NLP"
authors = ["Cyberbullying Prediction Team"]
license = "MIT"

packages = [{ include = "preprocessing_service" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = { version = "^0.27.0", extras = ["standard"] }
pydantic = "^2.5.0"

# Shared packages
cyberbullying-shared-common = { path = "../../packages/shared-common" }
cyberbullying-data-models = { path = "../../packages/data-models" }

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
